name: Offline ASR verification

on:
  push:
    branches: [master, "fix/**"]
  pull_request:
    branches: [master]

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Parse Windows deployment scripts
        shell: pwsh
        run: |
          $files = @("scripts/windows-generate-checksums.ps1", "scripts/windows-verify-package.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Run Java tests and build Windows x64 package
        shell: pwsh
        run: mvn -B -Pwindows-x64 clean test package
      - name: Verify Windows native library packaging
        shell: pwsh
        run: |
          $jar = "target/offline-asr-0.1.0-SNAPSHOT.jar"
          $entries = & jar tf $jar
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect package" }
          if (-not ($entries -contains "BOOT-INF/lib/sherpa-onnx-native-lib-win-x64-2.0.3.jar")) {
            throw "Windows x64 native library is missing from package"
          }
          $macEntries = $entries | Where-Object { $_ -match "osx-aarch64" }
          if ($macEntries) {
            throw "macOS native library must not be present in Windows package"
          }
      - name: Run browser JavaScript contract tests
        run: node scripts/verify-js-contract.mjs
