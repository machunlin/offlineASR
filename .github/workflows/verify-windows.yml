name: Offline ASR 三平台验证

on:
  push:
    branches: [master, develop, "fix/**", "feature/**"]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: macOS ARM64 构建与验证
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: 配置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 检查 Shell 与 Node 脚本语法
        run: |
          while IFS= read -r file; do bash -n "$file"; done < <(find scripts -name '*.sh' -type f | sort)
          while IFS= read -r file; do node --check "$file"; done < <(find scripts -name '*.mjs' -type f | sort)

      - name: 构建并运行 Java 测试
        run: mvn -B -Dmaven.repo.local=.m2 clean test package

      - name: 生成并校验 Maven 依赖清单与 SBOM
        run: bash scripts/generate-maven-inventory.sh macos-arm64

      - name: 验证浏览器 JavaScript 与 SDK 契约
        run: |
          node scripts/verify-js-contract.mjs
          node scripts/verify-sdk-contract.mjs

      - name: 验证 Fat JAR 依赖边界
        run: |
          jar tf target/offline-asr-0.1.0-SNAPSHOT.jar | grep -q 'BOOT-INF/lib/sherpa-onnx-jvm-2.0.3.jar'
          if jar tf target/offline-asr-0.1.0-SNAPSHOT.jar | grep -Eq 'sherpa-onnx-native-lib-'; then
            echo "Fat JAR 不应包含外部 Native Runtime" >&2
            exit 1
          fi

      - name: 保存 macOS 构建产物与测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-asr-macos-arm64
          path: |
            target/offline-asr-0.1.0-SNAPSHOT.jar
            target/surefire-reports/
            deploy/sbom-macos-arm64.cdx.json
            deploy/maven-runtime-dependencies-macos-arm64.txt
            deploy/maven-test-dependencies-macos-arm64.txt
            deploy/maven-licenses-macos-arm64.txt
          if-no-files-found: warn
          retention-days: 7

  linux-x64:
    name: Linux x64 构建与验证
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: 配置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 FFmpeg（仅用于 CI 测试环境）
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 检查 Shell 与 Node 脚本语法
        run: |
          while IFS= read -r file; do bash -n "$file"; done < <(find scripts -name '*.sh' -type f | sort)
          while IFS= read -r file; do node --check "$file"; done < <(find scripts -name '*.mjs' -type f | sort)

      - name: 构建并组装 Linux 应用包
        run: bash scripts/linux-package.sh

      - name: 验证 Linux 应用包与外部依赖隔离
        run: |
          test -f dist/linux-x64/app/offline-asr.jar
          test -f dist/linux-x64/config/application.yml
          test -f dist/linux-x64/scripts/linux-generate-checksums.sh
          test -f dist/linux-x64/offline-asr.service
          test -f dist/linux-x64/LICENSE
          test -f dist/linux-x64/THIRD_PARTY_NOTICES.md
          test -f dist/linux-x64/licenses/sherpa-onnx-LICENSE
          test -f dist/linux-x64/third-party/sbom-linux-x64.cdx.json
          test -f dist/linux-x64/checksums.sha256
          test -f dist/linux-x64/third-party/maven-runtime-dependencies.txt
          test -f dist/linux-x64/third-party/maven-test-dependencies.txt
          test -f dist/linux-x64/third-party/maven-licenses.txt
          if jar tf dist/linux-x64/app/offline-asr.jar | grep -Eq 'sherpa-onnx-native-lib-|onnxruntime|sherpa-onnx-jni'; then
            echo "Linux 应用 JAR 包含外部 Native Runtime" >&2
            exit 1
          fi

      - name: 验证浏览器 JavaScript 与 SDK 契约
        run: |
          node scripts/verify-js-contract.mjs
          node scripts/verify-sdk-contract.mjs

      - name: 保存 Linux 部署包与测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-asr-linux-x64
          path: |
            dist/linux-x64/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

  windows-x64:
    name: Windows x64 构建与验证
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: 配置 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 检查 PowerShell 与 Node 脚本语法
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath scripts -Filter *.ps1 -File -Recurse
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          Get-ChildItem -LiteralPath scripts -Filter *.mjs -File -Recurse | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Node.js 脚本语法检查失败：$($_.FullName)" }
          }

      - name: 构建并组装 Windows 应用包
        shell: cmd
        run: scripts\windows-package.bat

      - name: 验证 Windows 应用包与外部依赖隔离
        shell: pwsh
        run: |
          $required = @(
            "dist/windows-x64/app/offline-asr.jar",
            "dist/windows-x64/config/application.yml",
            "dist/windows-x64/scripts/windows-start.bat",
            "dist/windows-x64/scripts/windows-diagnose.bat",
            "dist/windows-x64/scripts/offline-asr.xml",
            "dist/windows-x64/LICENSE",
            "dist/windows-x64/THIRD_PARTY_NOTICES.md",
            "dist/windows-x64/licenses/sherpa-onnx-LICENSE",
            "dist/windows-x64/third-party/sbom-windows-x64.cdx.json",
            "dist/windows-x64/third-party/maven-runtime-dependencies.txt",
            "dist/windows-x64/third-party/maven-test-dependencies.txt",
            "dist/windows-x64/third-party/maven-licenses.txt",
            "dist/windows-x64/checksums.sha256"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing package file: $path" }
          }
          $jar = "dist/windows-x64/app/offline-asr.jar"
          $entries = & jar tf $jar
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect package" }
          if (-not ($entries -contains "BOOT-INF/lib/sherpa-onnx-jvm-2.0.3.jar")) {
            throw "Application JAR does not contain the sherpa-onnx Java Wrapper"
          }
          $otherEntries = $entries | Where-Object { $_ -match "sherpa-onnx-native-lib-|onnxruntime|sherpa-onnx-jni" }
          if ($otherEntries) { throw "Windows application JAR contains external Native Runtime" }

      - name: 验证浏览器 JavaScript 与 SDK 契约
        run: |
          node scripts/verify-js-contract.mjs
          node scripts/verify-sdk-contract.mjs

      - name: 保存 Windows 部署包与测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-asr-windows-x64
          path: |
            dist/windows-x64/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7
