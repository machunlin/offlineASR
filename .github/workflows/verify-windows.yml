name: Offline ASR 三平台验证

on:
  push:
    branches: [master, develop, "fix/**", "feature/**"]
  pull_request:
    branches: [master, develop]

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 检查启动脚本语法
        run: bash -n scripts/mac-start.sh scripts/verify-stage-three.sh scripts/download-linux-native.sh scripts/linux-package.sh scripts/linux-start.sh scripts/download-test-data.sh
      - name: 构建 macOS ARM64 并运行测试
        run: mvn -B -Pmacos-arm64 -Dmaven.repo.local=.m2 clean test package
      - name: 验证浏览器 JavaScript 契约
        run: node scripts/verify-js-contract.mjs
      - name: 验证 macOS 原生库打包
        run: |
          jar tf target/offline-asr-0.1.0-SNAPSHOT.jar | grep -q 'BOOT-INF/lib/sherpa-onnx-native-lib-osx-aarch64-2.0.3.jar'
          if jar tf target/offline-asr-0.1.0-SNAPSHOT.jar | grep -Eq 'linux-x64|win-x64'; then
            echo "macOS 包含其他平台原生库" >&2
            exit 1
          fi

  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装 FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: 下载并校验 Linux x64 原生库
        run: bash scripts/download-linux-native.sh
      - name: 检查 Linux 脚本语法
        run: bash -n scripts/linux-package.sh scripts/linux-start.sh scripts/download-linux-native.sh scripts/verify-stage-three.sh
      - name: 运行 Java 测试并构建 Linux x64
        run: mvn -B -Plinux-x64 -Dmaven.repo.local=.m2 clean test package
      - name: 验证 Linux 原生库打包隔离
        run: |
          jar tf target/offline-asr-0.1.0-SNAPSHOT.jar | grep -q 'BOOT-INF/lib/sherpa-onnx-native-lib-linux-x64-2.0.3.jar'
          if jar tf target/offline-asr-0.1.0-SNAPSHOT.jar | grep -Eq 'osx-aarch64|win-x64'; then
            echo "Linux 包含其他平台原生库" >&2
            exit 1
          fi
      - name: 验证浏览器 JavaScript 契约
        run: node scripts/verify-js-contract.mjs

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Parse Windows deployment scripts
        shell: pwsh
        run: |
          $files = @("scripts/windows-generate-checksums.ps1", "scripts/windows-verify-package.ps1", "scripts/download-test-data.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Run Java tests and build Windows x64 package
        shell: pwsh
        run: mvn -B -Pwindows-x64 "-Dmaven.repo.local=.m2" clean test package
      - name: Verify Windows native library packaging
        shell: pwsh
        run: |
          $jar = "target/offline-asr-0.1.0-SNAPSHOT.jar"
          $entries = & jar tf $jar
          if ($LASTEXITCODE -ne 0) { throw "Unable to inspect package" }
          if (-not ($entries -contains "BOOT-INF/lib/sherpa-onnx-native-lib-win-x64-2.0.3.jar")) {
            throw "Windows x64 native library is missing from package"
          }
          $otherEntries = $entries | Where-Object { $_ -match "osx-aarch64|linux-x64" }
          if ($otherEntries) { throw "Windows package contains another platform native library" }
      - name: Run browser JavaScript contract tests
        run: node scripts/verify-js-contract.mjs
