server:
  #默认绑定 127.0.0.1：只有本机能够访问，设置 ASR_HOST=0.0.0.0：监听所有网络接口，局域网其他设备也可能访问。
  # 默认只允许本机访问；只有明确需要局域网访问时才通过 ASR_HOST 覆盖。
  address: ${ASR_HOST:127.0.0.1}
  port: ${ASR_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: ${ASR_MAX_UPLOAD_MB:50}MB
      max-request-size: ${ASR_MAX_UPLOAD_MB:50}MB

asr:
  threads: ${ASR_THREADS:2}
  model-directory: ${ASR_MODEL_DIR:models/SenseVoiceSmall}
  temp-directory: ${ASR_TEMP_DIR:temp}
  ffmpeg-command: ${ASR_FFMPEG:ffmpeg}
  max-upload-mb: ${ASR_MAX_UPLOAD_MB:50}
  max-duration-seconds: ${ASR_MAX_DURATION_SECONDS:60}
  decode-timeout-seconds: ${ASR_DECODE_TIMEOUT_SECONDS:60}
  inference-timeout-seconds: ${ASR_INFERENCE_TIMEOUT_SECONDS:120}
  queue-timeout-seconds: ${ASR_QUEUE_TIMEOUT_SECONDS:5}

management:
  endpoints:
    web:
      exposure:
        include: health
